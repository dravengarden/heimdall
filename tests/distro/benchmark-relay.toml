version = 1

[execution]
backend = "ebpf"

[proxy]
default_policy = "proxy"

[proxy.outbounds.default]
type = "socks5"
server = "127.0.0.1"
server_port = 1080
network = ["tcp", "udp"]
connect_timeout = "2s"

[proxy.policies.proxy.dns]
mode = "fake"

[proxy.policies.proxy.final]
tcp = { type = "route", outbound = "default" }
udp = { type = "reject", method = "refused" }

[proxy.policies.direct.dns]
mode = "system"

[proxy.policies.direct.final]
tcp = { type = "direct" }
udp = { type = "direct" }

[proxy.policies.udp.dns]
mode = "fake"

[proxy.policies.udp.final]
tcp = { type = "reject", method = "refused" }
udp = { type = "route", outbound = "default" }

[capture]
mode = "on"
max_bytes_per_flow = 512
block_max_bytes = 32
flush_interval_ms = 20
boundaries = ["transport", "tls_plaintext.runtime", "tls_plaintext.relay"]
directions = ["client_to_remote", "remote_to_client"]
redact_env = []

[decrypt]
mode = "relay"
ca_cert = "/home/tester/.local/state/heimdall/benchmark-ca/ca.pem"
ca_key = "/home/tester/.local/state/heimdall/benchmark-ca/ca-key.pem"
