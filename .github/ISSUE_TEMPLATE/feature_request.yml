name: Feature request
description: Propose a focused improvement that fits Heimdall's command-scoped proxy boundary.
title: "[feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Check [ROADMAP.md](https://github.com/dravengarden/heimdall/blob/main/ROADMAP.md) first. Heimdall intentionally does not target Kubernetes, host-wide proxying, Nickel, or universal TLS decryption.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or agent workflow is blocked today?
      placeholder: Describe the concrete command, runtime, or operational boundary.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What behavior or contract would solve the problem?
      placeholder: Describe the smallest useful change and its expected CLI/config surface.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How could this be tested and reported through the CLI or agent contract?
      placeholder: List observable success and failure cases.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This proposal fits the command-scoped Linux proxy boundary.
          required: true
        - label: I searched existing issues and the roadmap.
          required: true
