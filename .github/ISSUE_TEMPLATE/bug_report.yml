name: Bug report
description: Report a reproducible problem in the command wrapper, daemon, or eBPF path.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not include credentials, private hostnames, internal addresses, or unredacted config secrets. Security vulnerabilities belong in the private process described by [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
      placeholder: A short description of the observed behavior and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest command and sanitized configuration that reproduces the issue.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Heimdall version or commit
      placeholder: heimdall --version
    validations:
      required: true
  - type: input
    id: kernel
    attributes:
      label: Kernel and distribution
      placeholder: uname -r; distribution and release
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste sanitized output from heimdall agent and the relevant run JSONL records.
      render: json
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed credentials, private hostnames, internal addresses, and other sensitive data.
          required: true
        - label: I searched existing issues and did not find a duplicate.
          required: true
