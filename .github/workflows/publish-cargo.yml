name: Publish crates.io packages
run-name: crates.io ${{ github.event.release.tag_name }}

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: >-
      github.event.release.prerelease == false &&
      vars.CARGO_TRUSTED_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          rustup set auto-self-update disable
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Download locally packaged crates
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir dist
          gh release download "$RELEASE_TAG" \
            --dir dist \
            --pattern '*.crate' \
            --pattern '*.crate.sha256'
          test "$(find dist -maxdepth 1 -type f -name '*.crate' | wc -l)" -eq 3
          (cd dist && sha256sum -c ./*.crate.sha256)

      - name: Reproduce the locally packaged crates
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-package"
          for package in heimdall-common heimdall-config heimdall-egress; do
            cargo package --package "$package" --locked --no-verify \
              --config 'patch.crates-io.heimdall-common.path="heimdall-common"' \
              --config 'patch.crates-io.heimdall-config.path="heimdall-config"'
            cmp \
              "$CARGO_TARGET_DIR/package/$package-$version.crate" \
              "dist/$package-$version.crate"
          done

      - name: Obtain a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish with the native Cargo CLI
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for package in heimdall-common heimdall-config heimdall-egress; do
            cargo publish --package "$package" --locked --no-verify
            for attempt in $(seq 1 30); do
              if cargo info "$package@$version" >/dev/null 2>&1; then
                break
              fi
              test "$attempt" -lt 30
              sleep 2
            done
          done
