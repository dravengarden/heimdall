name: Publish crates.io package
run-name: crates.io ${{ github.event.release.tag_name }}

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: >-
      github.event.release.prerelease == false &&
      vars.CARGO_TRUSTED_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          rustup set auto-self-update disable
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Download the locally packaged crate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir dist
          gh release download "$RELEASE_TAG" \
            --dir dist \
            --pattern '*.crate' \
            --pattern '*.crate.sha256'
          test "$(find dist -maxdepth 1 -type f -name '*.crate' | wc -l)" -eq 1
          (cd dist && sha256sum -c ./*.crate.sha256)

      - name: Reproduce the locally packaged crate
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-package"
          cargo package --package heimdall-egress --locked --no-verify
          cmp \
            "$CARGO_TARGET_DIR/package/heimdall-egress-$version.crate" \
            "dist/heimdall-egress-$version.crate"

      - name: Obtain a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish with the native Cargo CLI
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cargo publish --package heimdall-egress --locked --no-verify
          for attempt in $(seq 1 30); do
            if cargo info "heimdall-egress@$version" >/dev/null 2>&1; then
              break
            fi
            test "$attempt" -lt 30
            sleep 2
          done
