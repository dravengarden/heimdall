name: Publish npm package
run-name: npm ${{ github.event.release.tag_name }}

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node.js and npm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download the locally built package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="heimdall-egress-${version}.tgz"
          checksum="${archive}.sha256"
          gh release download "$RELEASE_TAG" --pattern "$archive" --pattern "$checksum"
          sha256sum -c "$checksum"
          printf '%s\n' "archive=$archive" >> "$GITHUB_ENV"

      - name: Publish with the native npm CLI
        run: npm publish "$archive" --access public
