name: Publish PyPI package
run-name: PyPI ${{ github.event.release.tag_name }}

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install the pinned publishing CLI
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          enable-cache: false

      - name: Download the locally built wheels
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir dist
          gh release download "$RELEASE_TAG" \
            --dir dist \
            --pattern 'heimdall_egress-*.whl' \
            --pattern 'heimdall_egress-*.whl.sha256'
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 2
          (cd dist && sha256sum -c ./*.whl.sha256)

      - name: Publish with the native uv CLI
        run: uv publish --trusted-publishing always dist/*.whl
