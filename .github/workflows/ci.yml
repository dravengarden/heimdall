name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all --check

  ebpf:
    name: eBPF build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly-2026-03-13
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: heimdall-ebpf
      - name: Build eBPF programs
        run: |
          cd heimdall-ebpf
          cargo +nightly build -Z build-std=core \
                               --target bpfel-unknown-none --release
      - name: Upload eBPF artifact
        uses: actions/upload-artifact@v7
        with:
          name: heimdall-ebpf
          path: heimdall-ebpf/target/bpfel-unknown-none/release/heimdall-ebpf
          if-no-files-found: error

  ui:
    name: UI typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.8.1"
      - name: deno install
        working-directory: heimdall-ui
        run: deno install --frozen --allow-scripts
      - name: deno typecheck
        working-directory: heimdall-ui
        run: deno task typecheck
      - name: deno build
        working-directory: heimdall-ui
        run: deno task build
      - name: Upload UI bundle
        uses: actions/upload-artifact@v7
        with:
          name: heimdall-ui-dist
          path: heimdall-ui/dist
          if-no-files-found: error

  build:
    name: Userspace build + test
    needs: [ebpf, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Download eBPF artifact
        uses: actions/download-artifact@v8
        with:
          name: heimdall-ebpf
          path: heimdall-ebpf/target/bpfel-unknown-none/release
      - name: Download UI bundle
        uses: actions/download-artifact@v8
        with:
          name: heimdall-ui-dist
          path: heimdall-ui/dist
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --release
      - name: cargo build --release
        run: cargo build --release --workspace
