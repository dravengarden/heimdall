name: Linux release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Validate tag version
        if: github.ref_type == 'tag'
        run: |
          version=$(nix eval --raw .#packages.x86_64-linux.release.version)
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match release version v${version}" >&2
            exit 1
          }

      - name: Build and test release package
        run: |
          nix build \
            .#checks.x86_64-linux.release \
            .#checks.x86_64-linux.release-aarch64 \
            -L
          nix build .#release -L --out-link release-x86_64
          nix build .#release-aarch64 -L --out-link release-aarch64
          mkdir dist
          cp -L release-x86_64/* release-aarch64/* dist/
          (cd dist && sha256sum -c ./*.sha256)

      - name: Attest release archives
        uses: actions/attest@v4
        with:
          subject-path: "dist/*.tar.gz"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: heimdall-linux-musl
          path: dist/
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --verify-tag \
              --generate-notes \
              --title "Heimdall ${GITHUB_REF_NAME}"
          fi
