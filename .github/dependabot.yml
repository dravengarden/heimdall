version: 2

updates:
  # Cargo: keep cargo deps fresh. Group patch + minor updates so we
  # get one PR per ecosystem instead of N noisy ones.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types: ["patch", "minor"]

  # eBPF crate (separate workspace).
  - package-ecosystem: cargo
    directory: /heimdall-ebpf
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      patch-and-minor:
        update-types: ["patch", "minor"]
