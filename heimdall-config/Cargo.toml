[package]
name = "heimdall-config"
version = "0.1.5"
edition = "2024"
rust-version.workspace = true
publish = false
description = "Strict configuration schema for Heimdall egress"
license = "Apache-2.0"
repository = "https://github.com/dravengarden/heimdall"
homepage = "https://dravengarden.github.io/heimdall/"
readme = "README.md"
keywords = ["heimdall", "configuration", "proxy"]
categories = ["config", "network-programming"]

[lints]
workspace = true

[package.metadata.cargo-machete]
# cargo-machete does not follow the #[path] module that keeps this internal
# test crate on the CLI package's canonical schema source.
ignored = ["schemars", "serde", "serde_json", "serde_yaml_ng", "thiserror", "toml"]

[dependencies]
schemars = "=1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "1.1"
thiserror = "1"
