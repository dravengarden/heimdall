[package]
name = "heimdall-config"
version = "0.1.3"
edition = "2024"
rust-version.workspace = true
publish = ["crates-io"]
description = "Strict configuration schema for Heimdall egress"
license = "Apache-2.0"
repository = "https://github.com/dravengarden/heimdall"
homepage = "https://dravengarden.github.io/heimdall/"
readme = "README.md"
keywords = ["heimdall", "configuration", "proxy"]
categories = ["config", "network-programming"]

[lints]
workspace = true

[dependencies]
schemars = "=1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "0.8"
thiserror = "1"
