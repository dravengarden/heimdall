[workspace]
members = [
    "heimdall",
    "heimdall-common",
    "heimdall-config",
    # heimdall-ebpf is compiled separately targeting bpfel-unknown-none
]
resolver = "3"

[workspace.package]
rust-version = "1.95.0"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Aya, Axum, and SQLx bridge ecosystems that intentionally retain multiple
# compatible major versions of small foundational crates.
multiple_crate_versions = { level = "allow", priority = 1 }

[profile.dev]
debug = "line-tables-only"
