[package]
name = "heimdall-common"
version = "0.1.4"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Shared kernel/userspace wire types for Heimdall egress"
license = "Apache-2.0"
repository = "https://github.com/dravengarden/heimdall"
homepage = "https://dravengarden.github.io/heimdall/"
readme = "README.md"
keywords = ["heimdall", "ebpf", "networking"]
categories = ["network-programming"]

[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# no_std for eBPF side; "user" enables std + aya::Pod
[features]
default = ["user"]
user = ["aya"]

[dependencies]
aya = { version = "0.14", optional = true }
