[package]
name = "heimdall-egress"
version = "0.1.5"
edition = "2024"
autobins = false
rust-version.workspace = true
publish = ["crates-io"]
description = "Command-scoped TCP/UDP proxy with transparent TLS inspection"
license = "Apache-2.0"
repository = "https://github.com/dravengarden/heimdall"
homepage = "https://dravengarden.github.io/heimdall/"
readme = "../packaging/cargo/README.md"
keywords = ["proxy", "egress", "ebpf", "socks5", "cli"]
categories = ["command-line-utilities", "network-programming"]
include = ["src/**", "schemas/**", "embedded/heimdall-ebpf"]

[lints]
workspace = true

[dependencies]
# CLI argument parsing
clap = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow = "1"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
jsonschema = { version = "0.47", default-features = false }
schemars = "=1.2.2"
serde_yaml_ng = "0.10"
toml = "0.8"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
base64 = "0.22"
hex = "0.4"
libc = "0.2"
sha2 = "0.10"
uuid = { version = "=1.10.0", features = ["serde", "v7"] }

[target.'cfg(target_os = "linux")'.dependencies]
# eBPF userspace management: load programs, attach to cgroups, read/write maps
aya = "0.14"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# `heimdall run` cgroup management — fork/exec/waitpid + signal masking.
# `process` for fork/wait, `signal` for SIGINT propagation to the child.
nix = { version = "0.29", features = ["process", "signal", "fs", "mount", "sched", "net", "socket", "uio"] }
rustix = { version = "0.38", features = ["net", "process"] }

# Cache types for resolver maps
parking_lot = "0.12"

# DNS message parsing/serialization for heimdall's fake-IP DNS server.
hickory-proto = { version = "0.26", default-features = false }

rcgen = { version = "0.13", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.16"

[[bin]]
name = "heimdall"
path = "src/main.rs"
