[package]
name = "heimdall"
version = "0.1.1"
edition = "2024"
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# eBPF userspace management: load programs, attach to cgroups, read/write maps
aya = "0.14"

# Shared data types with the eBPF programs
heimdall-common = { path = "../heimdall-common" }

# Strict shared schema for TOML, YAML, and JSON configuration.
heimdall-config = { path = "../heimdall-config" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI argument parsing
clap = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Low-level socket options
libc = "0.2"

# `heimdall run` cgroup management — fork/exec/waitpid + signal masking.
# `process` for fork/wait, `signal` for SIGINT propagation to the child.
nix = { version = "0.29", features = ["process", "signal", "fs", "mount", "sched", "net", "socket", "uio"] }
rustix = { version = "0.38", features = ["net", "process"] }

# Cache types for resolver maps
parking_lot = "0.12"

# DNS message parsing/serialization for heimdall's fake-IP DNS server.
hickory-proto = { version = "0.26", default-features = false }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
jsonschema = { version = "0.47", default-features = false }
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
uuid = { version = "=1.10.0", features = ["serde", "v7"] }
rcgen = { version = "0.13", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.16"

[[bin]]
name = "heimdall"
path = "src/main.rs"
